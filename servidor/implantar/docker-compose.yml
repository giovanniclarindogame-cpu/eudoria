# Servidor de partidas + Caddy (HTTPS/wss automático). Variáveis em .env (o instalar.sh cria).
services:
  servidor:
    build:
      context: ../..
      dockerfile: servidor/implantar/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      MAX_PARTIDAS: "${MAX_PARTIDAS:-30}"
      AQUECIDAS: "${AQUECIDAS:-2}"
      BUILD_MINIMO: "${BUILD_MINIMO:-1}"
      ORIGENS: "${ORIGENS:-}"
    volumes:
      - dados:/dados
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - servidor
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: "${DOMINIO:?defina DOMINIO no arquivo .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  dados:
  caddy_data:
  caddy_config:
