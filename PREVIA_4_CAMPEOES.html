<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eldoria · Novas habilidades</title><style>
*{box-sizing:border-box}body{margin:0;background:#071c18;color:#f2e9cc;font:15px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font:36px Georgia}nav,.skills{display:flex;gap:8px;flex-wrap:wrap}button,a{color:inherit;border:1px solid #5c6652;background:#18352b;padding:12px;border-radius:9px;cursor:pointer;text-decoration:none}button.active{border-color:#f9cc68;background:#45503b}.skills button{flex:1;min-width:120px}.skills img{width:48px;height:48px;display:block;margin:auto auto 8px;image-rendering:pixelated}canvas{width:100%;max-height:420px;object-fit:contain;background:radial-gradient(ellipse at center,#305244,#0c211b);border:1px solid #546348;border-radius:14px;margin:20px 0;image-rendering:pixelated}p{color:#b7c8b8}footer{display:flex;gap:16px;align-items:center;margin:20px 0}input{width:180px}
</style><main><p>ELDORIA · ESTÚDIO DE EFEITOS</p><h1>Quatro identidades. 24 habilidades.</h1><nav id="heroes"></nav><canvas id="canvas" width="960" height="380"></canvas><div class="skills" id="skills"></div><footer><button id="flip">Sentido: direita →</button><button id="pause">Pausar</button><input id="scrub" type="range" min="0" max="23" value="0" aria-label="Quadro"><span id="frame"></span></footer><p>Sequências de 24 quadros. Esta prévia mostra o efeito isolado; movimento, colisão e recursos são aplicados na arena.</p><a href="index.html?v=9">Abrir o jogo →</a></main><script>
const kits=[['spark','Herdeiro da Centelha',['Impacto Esmeralda','Chute Relâmpago','Salto Ricochete','Estalo de Vento','Corpo Energizado','Limite Rompido']],['tide','Corsário da Maré',['Soco Elástico','Rajada Flexível','Estouro Duplo','Catapulta Humana','Modo Turbo','Punho Titã']],['star','Cavaleiro do Firmamento',['Rajada Estelar','Cometa Alado','Chute Crescente','Investida Galopante','Cosmo Desperto','Constelação do Corcel']],['steel','Alquimista de Aço',['Palma Forjadora','Braço Lâmina','Espinhos do Subsolo','Muralha Instantânea','Punho de Ferro','Colosso de Pedra']]];
const $=s=>document.querySelector(s),g=$('#canvas').getContext('2d'),cache=new Map();let hero=0,slot=0,left=false,paused=false,f=0,age=0,last=0;
function select(){age=0;$('#heroes').innerHTML=kits.map((k,i)=>`<button data-hero="${i}" class="${i===hero?'active':''}">${k[1]}</button>`).join('');$('#skills').innerHTML=kits[hero][2].map((n,i)=>`<button data-slot="${i}" class="${i===slot?'active':''}"><img src="assets/reforged_v9/${kits[hero][0]}-${i}-icon.webp" alt="">${n}</button>`).join('')}
document.onclick=e=>{const h=e.target.closest('[data-hero]'),s=e.target.closest('[data-slot]');if(h){hero=+h.dataset.hero;slot=0;select()}if(s){slot=+s.dataset.slot;select()}};
$('#flip').onclick=()=>{left=!left;$('#flip').textContent=left?'Sentido: ← esquerda':'Sentido: direita →'};$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'Reproduzir':'Pausar'};$('#scrub').oninput=e=>{paused=true;$('#pause').textContent='Reproduzir';f=+e.target.value};
function tick(t){if(!paused){age+=(t-last)/1000||0;f=Math.floor(age*20)%24}last=t;const path=`assets/reforged_v9/${kits[hero][0]}-${slot}.webp`;if(!cache.has(path)){const im=new Image();im.src=path;cache.set(path,im)}const im=cache.get(path);g.clearRect(0,0,960,380);g.save();g.translate(480,190);if(left)g.scale(-1,1);g.imageSmoothingEnabled=false;if(im.naturalWidth)g.drawImage(im,f%6*128,Math.floor(f/6)*128,128,128,-160,-160,320,320);g.restore();$('#frame').textContent=`Quadro ${f+1}/24`;$('#scrub').value=f;requestAnimationFrame(tick)}select();requestAnimationFrame(tick);
</script></html>
